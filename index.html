<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#202860">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Dome — AR Augment">
<meta property="og:description" content="Point your camera at the artwork: a low-poly dome in the painting's own blue, with a cat chasing a mouse inside.">
<meta property="og:image" content="./artwork-target.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 26 A12 12 0 0 1 28 26 Z' fill='none' stroke='%232a3670' stroke-width='3'/></svg>">
<title>Dome — AR Augment</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#111; }
  #ar-container { position:fixed; inset:0; width:100%; height:100%; }
  /* MindAR injects the camera <video> at z-index:-2 — behind the page background. Pin it visible. */
  #ar-container video { position:absolute; z-index:0 !important; object-fit:cover; }
  #ar-container canvas { z-index:1 !important; }
  #hint {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    font-family:ui-monospace, Menlo, monospace; font-size:13px; letter-spacing:.08em;
    color:#fff; background:rgba(32,40,96,.82); border:1px solid #4a56a8;
    padding:10px 18px; border-radius:999px; pointer-events:none; z-index:10;
    transition:opacity .6s; text-align:center; max-width:80vw;
  }
  #hint.hidden { opacity:0; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/" } }
</script>
</head>
<body>
<div id="ar-container"></div>
<div id="hint">Point your camera at the artwork</div>
<script type="module">
import 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';
import * as THREE from 'three';
import { mergeBufferGeometries as mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* MindAR renders with sRGB output; without color management three r150 treats hex
   colors as linear and the navy linework comes out washed-out lavender. */
THREE.ColorManagement.enabled = true;

/* Palette sampled from the artwork */
const BLUE = 0x2a3670;        /* linework */
const GREEN = 0x5bbf8a;

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = REDUCED ? 0.5 : 1.0;

const { MindARThree } = window.MINDAR.IMAGE;
const hint = document.getElementById('hint');

/* ---------- image target: chunked + gzipped, reassembled in-browser ---------- */
async function gunzip(buf) {
  if ('DecompressionStream' in window) {
    const ds = new DecompressionStream('gzip');
    return new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer();
  }
  const { ungzip } = await import('https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.esm.mjs');
  return ungzip(new Uint8Array(buf)).buffer;
}
async function loadChunked(prefix, manifestUrl) {
  const { parts } = await (await fetch(manifestUrl)).json();
  const bufs = await Promise.all(parts.map(async p =>
    new Uint8Array(await (await fetch(prefix + '.' + p)).arrayBuffer())));
  const total = bufs.reduce((n, p) => n + p.length, 0);
  const buf = new Uint8Array(total);
  let off = 0; for (const p of bufs) { buf.set(p, off); off += p.length; }
  return buf;
}
async function loadTarget() {
  const plain = await gunzip(await loadChunked('./artwork.mind.gz', './artwork.mind.manifest.json'));
  return URL.createObjectURL(new Blob([plain]));
}

/* ---------- seeded PRNG (stable irregularity) ---------- */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- scene shared by AR and fallback preview ----------
   Pavilion form from the artist's rendered mockup: an open-fronted ring of thin
   navy struts. Pillars stand straight off the canvas to an eave ring, rafters
   slope in to a flat top ring, and the side facing the viewer (+z, the bottom
   of the painting) is left open. */
const R = 0.36;           /* eave radius relative to target width (spans most of the canvas) */
const STROKE = 0.0075;    /* strut radius — even weight, like the painting's marker lines */
const WALL_H = 0.20;      /* pillar height */
const ROOF_H = 0.10;      /* roof rise above the eave */
const APEX_R = 0.21;      /* flat top ring radius */
const SIDES = 10;
const OPEN_SIDES = 3;     /* sides removed on the viewer-facing front */
const ORBIT = R * 0.55;
/* Target image is 900x643 (rectified, 7:5 canvas). Units = image width. */
const TARGET_H = 643 / 900;
/* Gazebo base centered on the painting's green dome: pixel (410, 290) in the
   target → x = (px - W/2) / W, z = (py - H/2) / W  (+z = down the image). */
const ANCHOR_X = (410 - 450) / 900;
const ANCHOR_Z = (311 - 321.5) / 900;
const PARAMS = new URLSearchParams(location.search);
const DEBUG = PARAMS.has('debug');
/* ?scale=0.6 — tune augment size on-device without a redeploy */
const SCALE = Math.min(Math.max(parseFloat(PARAMS.get('scale')) || 1, 0.1), 3);

function buildScene(scene) {
  const root = new THREE.Group();
  scene.add(root);

  /* lighting — matte, gallery-flat */
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const key = new THREE.DirectionalLight(0xfff4e0, 1.0);
  key.position.set(0.6, 1.2, 0.9);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.6);
  rim.position.set(-0.8, 0.5, -0.6);
  scene.add(rim);

  const domeMat = new THREE.MeshStandardMaterial({ color: BLUE, roughness: 0.6, metalness: 0, flatShading: true });

  const rand = mulberry32(20261010);
  const jitter = (amp) => (rand() - 0.5) * amp;

  /* ring vertices; angle 90° (+z) faces the viewer, so the open gap is centered there */
  const eave = [], apex = [];
  for (let i = 0; i < SIDES; i++) {
    const a = Math.PI / 2 + ((i + 0.5) / SIDES) * Math.PI * 2;
    const re = R * (1 + jitter(0.03));
    eave.push(new THREE.Vector3(Math.cos(a) * re, WALL_H, Math.sin(a) * re));
    const ra = APEX_R * (1 + jitter(0.04));
    apex.push(new THREE.Vector3(Math.cos(a) * ra, WALL_H + ROOF_H, Math.sin(a) * ra));
  }
  /* edge i joins vertex i → i+1; the OPEN_SIDES edges straddling the front are dropped */
  const isOpen = (e) => {
    const k = ((e - (SIDES - 1)) % SIDES + SIDES) % SIDES;   /* edge SIDES-1 sits dead-front */
    const d = Math.min(k, SIDES - k);
    return d <= (OPEN_SIDES - 1) / 2;
  };

  /* merge every strut + joint into ONE geometry (one draw call) */
  const geos = [];
  const up = new THREE.Vector3(0, 1, 0);
  function strut(a, b) {
    const g = new THREE.CylinderGeometry(STROKE, STROKE, a.distanceTo(b), 8, 1, false).toNonIndexed();
    const m = new THREE.Matrix4();
    const q = new THREE.Quaternion().setFromUnitVectors(up, b.clone().sub(a).normalize());
    m.compose(a.clone().add(b).multiplyScalar(0.5), q, new THREE.Vector3(1, 1, 1));
    g.applyMatrix4(m);
    geos.push(g);
  }
  function joint(p) {   /* small sphere so mitred corners read as one bent rod */
    const g = new THREE.SphereGeometry(STROKE, 8, 6).toNonIndexed();
    g.translate(p.x, p.y, p.z);
    geos.push(g);
  }

  for (let i = 0; i < SIDES; i++) {
    const j = (i + 1) % SIDES;
    const used = !isOpen(i) || !isOpen((i - 1 + SIDES) % SIDES);
    if (used) {
      strut(new THREE.Vector3(eave[i].x, 0, eave[i].z), eave[i]);   /* pillar, straight off the canvas */
      strut(eave[i], apex[i]);                                      /* rafter */
      joint(eave[i]); joint(apex[i]);
    }
    if (!isOpen(i)) {
      strut(eave[i], eave[j]);                                      /* eave ring */
      strut(apex[i], apex[j]);                                      /* top ring */
    }
  }

  const dome = new THREE.Group();
  dome.add(new THREE.Mesh(mergeGeometries(geos, false), domeMat));
  root.add(dome);

  /* ---------- cat (blue linework = structure/predator) ---------- */
  function makeCat() {
    const c = new THREE.Group();
    const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.030, 0), domeMat);
    body.scale.set(1.5, 1.0, 0.9);
    c.add(body);
    const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.020, 0), domeMat);
    head.position.set(0.042, 0.016, 0);
    c.add(head);
    const earGeo = new THREE.ConeGeometry(0.009, 0.018, 4);
    const earL = new THREE.Mesh(earGeo, domeMat); earL.position.set(0.042, 0.038, 0.010);
    const earR = new THREE.Mesh(earGeo, domeMat); earR.position.set(0.042, 0.038, -0.010);
    c.add(earL, earR);
    const eyeGeo = new THREE.IcosahedronGeometry(0.004, 0);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffe08a });
    const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(0.058, 0.020, 0.009);
    const eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set(0.058, 0.020, -0.009);
    c.add(eL, eR);
    const legGeo = new THREE.ConeGeometry(0.006, 0.026, 4);
    [[0.022, 0.012], [0.022, -0.012], [-0.026, 0.012], [-0.026, -0.012]].forEach(p => {
      const leg = new THREE.Mesh(legGeo, domeMat);
      leg.rotation.x = Math.PI; leg.position.set(p[0], -0.026, p[1]);
      c.add(leg);
    });
    const tail = new THREE.Mesh(new THREE.TorusGeometry(0.020, 0.005, 4, 8, Math.PI * 1.1), domeMat);
    tail.position.set(-0.048, 0.012, 0); tail.rotation.y = Math.PI / 2;
    c.add(tail);
    c.userData.tail = tail;
    return c;
  }
  /* ---------- mouse (green = emerged from the painting's green node) ---------- */
  function makeMouse() {
    const m = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: GREEN, roughness: 0.85, metalness: 0, flatShading: true });
    const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.014, 0), mat);
    body.scale.set(1.6, 0.9, 0.9);
    m.add(body);
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.006, 0.014, 4), mat);
    nose.rotation.z = -Math.PI / 2; nose.position.set(0.026, 0, 0);
    m.add(nose);
    const earGeo = new THREE.IcosahedronGeometry(0.006, 0);
    const earL = new THREE.Mesh(earGeo, mat); earL.position.set(0.006, 0.012, 0.008);
    const earR = new THREE.Mesh(earGeo, mat); earR.position.set(0.006, 0.012, -0.008);
    m.add(earL, earR);
    const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.0022, 0.001, 0.045, 4), mat);
    tail.rotation.z = Math.PI / 2 - 0.4; tail.position.set(-0.032, 0.004, 0);
    m.add(tail);
    return m;
  }

  const cat = makeCat();
  const mouse = makeMouse();
  const catY = 0.038, mouseY = 0.016;
  cat.position.y = catY; mouse.position.y = mouseY;
  root.add(cat, mouse);

  return { root, dome, cat, mouse, catY, mouseY };
}

/* ---------- chase dramaturgy: CHASE → FREEZE (cat overshoots) → STANDOFF → reverse ---------- */
const actors = (() => {
  let mA = 0, cA = -0.8, dir = 1;
  let state = 'CHASE', stateT = 0, chaseDur = 7;
  let mV = 1.6, cV = 0;
  return {
    step(dt, t) {
      stateT += dt;
      if (state === 'CHASE') {
        mV = 1.6 * MOTION;
        mA += dir * mV * dt;
        let d = (mA - cA) * dir;
        cV = (d * 4.0 + 0.9) * MOTION;
        cA += dir * cV * dt;
        if (stateT > chaseDur) { state = 'FREEZE'; stateT = 0; mV = 0; }
      } else if (state === 'FREEZE') {
        /* mouse stops dead; cat overshoots and decelerates */
        cV = Math.max(0, cV - dt * 3.0);
        cA += dir * cV * dt;
        if (cV === 0) { state = 'STANDOFF'; stateT = 0; }
      } else if (state === 'STANDOFF') {
        if (stateT > 1.5) {
          state = 'CHASE'; stateT = 0;
          dir *= -1;                       /* mouse bolts the other way */
          chaseDur = 6 + Math.random() * 4;
          /* swap leader: cat now ahead gets chased past */
          const gap = 0.6;
          cA = mA + dir * gap;
        }
      }
      return { mA, cA, dir, state };
    }
  };
})();

function animateActors(A, dt, t) {
  const { mA, cA, state } = actors.step(dt, t);
  const wob = Math.sin(t * 2.2) * 0.05;  /* weave crosses the far arc */
  const mr = ORBIT * (1 + wob);
  const moving = state === 'CHASE' ? 1 : 0;
  A.mouse.position.set(Math.cos(mA) * mr, A.mouseY + Math.abs(Math.sin(t * 14)) * 0.006 * moving, Math.sin(mA) * mr);
  A.mouse.rotation.y = -mA - Math.PI / 2 + Math.sin(t * 9) * 0.15 * moving;
  const cr = ORBIT * (1 - wob * 0.5);
  A.cat.position.set(Math.cos(cA) * cr, A.catY + Math.abs(Math.sin(t * 10)) * 0.008 * moving, Math.sin(cA) * cr);
  A.cat.rotation.y = -cA - Math.PI / 2;
  /* tail flicks: calm while chasing, agitated in standoff */
  const flick = state === 'STANDOFF' ? 1.8 : 1.0;
  A.cat.userData.tail.rotation.x = Math.sin(t * 6 * flick) * 0.4 * flick;
  if (!REDUCED) {
    const s = 1 + Math.sin(t * 0.8) * 0.008;
    A.dome.scale.set(s, 1 + Math.sin(t * 0.8 + 1) * 0.005, s);
  }
}

/* ---------- boot: AR, or orbit-preview fallback ---------- */
const clock = new THREE.Clock();

async function startAR() {
  const targetUrl = await loadTarget();
  const mindarThree = new MindARThree({
    container: document.querySelector('#ar-container'),
    imageTargetSrc: targetUrl,
    /* MindAR's default One Euro filter settings. A tiny filterBeta (we had 0.01)
       makes the anchor lag behind camera motion, which reads as misalignment. */
    missTolerance: 10,
    warmupTolerance: 5,
    renderer: { powerPreference: 'high-performance' },
  });
  const { renderer, scene, camera } = mindarThree;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  renderer.setClearColor(0x000000, 0);  /* transparent — camera video must show through */

  const anchor = mindarThree.addAnchor(0);
  /* MindAR's anchor frame: the image lies in the XY plane (+x right, +y up the
     image), +z points out of the canvas toward the camera. The scene is authored
     y-up on an XZ ground plane (same as the preview), so stand it up off the canvas:
     rotating +90° about X maps local +y → out of the canvas, local +z → down the image. */
  const canvasFrame = new THREE.Group();
  canvasFrame.rotation.x = Math.PI / 2;
  anchor.group.add(canvasFrame);
  const A = buildScene(scene);
  canvasFrame.add(A.root);
  A.root.position.set(ANCHOR_X, 0, ANCHOR_Z);
  A.root.scale.setScalar(SCALE);
  if (DEBUG) {
    /* ?debug — outline of the tracked target, drawn in MindAR's native frame */
    const outline = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, TARGET_H)),
      new THREE.LineBasicMaterial({ color: 0x00ff88 }));
    const fill = new THREE.Mesh(new THREE.PlaneGeometry(1, TARGET_H),
      new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.15, depthWrite: false }));
    anchor.group.add(outline, fill);
  }

  anchor.onTargetFound = () => hint.classList.add('hidden');
  anchor.onTargetLost = () => hint.classList.remove('hidden');

  await mindarThree.start();
  /* MindAR computes the camera projection in resize(), which can fire before the
     video stream is ready — leaving a default FOV that misplaces the anchor.
     Re-run it once the stream is live and on orientation changes. */
  mindarThree.resize();
  window.addEventListener('orientationchange', () => setTimeout(() => mindarThree.resize(), 300));
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    animateActors(A, dt, clock.elapsedTime);
    renderer.render(scene, camera);
  });
}

function startPreview() {
  hint.textContent = 'Camera unavailable — drag to explore the augment';
  const container = document.querySelector('#ar-container');
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.outputEncoding = THREE.sRGBEncoding;  /* match MindAR's renderer so preview == AR */
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  /* the artwork as the ground plane the dome sits on (chunked jpg, reassembled) */
  (async () => {
    const buf = await loadChunked('./artwork-target.jpg', './artwork-target.manifest.json');
    const url = URL.createObjectURL(new Blob([buf], { type: 'image/jpeg' }));
    new THREE.TextureLoader().load(url, tex => {
      tex.encoding = THREE.sRGBEncoding;
      const aspect = tex.image.width / tex.image.height;
      const art = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1 / aspect),
        new THREE.MeshBasicMaterial({ map: tex })
      );
      art.rotation.x = -Math.PI / 2;
      scene.add(art);
    });
  })();
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 10);
  camera.position.set(0.62, 0.78, 1.05);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(ANCHOR_X, 0.1, ANCHOR_Z);
  controls.enableDamping = true;

  const A = buildScene(scene);
  A.root.position.set(ANCHOR_X, 0, ANCHOR_Z);
  A.root.scale.setScalar(SCALE);

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    animateActors(A, dt, clock.elapsedTime);
    controls.update();
    renderer.render(scene, camera);
  });
}

startAR().catch(err => {
  console.warn('AR start failed, falling back to preview:', err);
  startPreview();
});
</script>
</body>
</html>
